name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Blocking: the pre-existing component a11y backlog the harness found
      # at launch (Sep 2026) cleared 22 Sep 2026 (102/102 checks passing,
      # see docs/DEFECTS.md) — regressions should fail CI from here on.
      - name: Accessibility (axe)
        run: npm run test:a11y
