name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Non-blocking for now: the harness landed Sep 2026 and immediately
      # surfaced real, pre-existing component a11y bugs (tracked one by one
      # in docs/DEFECTS.md). Flip to blocking once that backlog clears —
      # see the Q4 "Accessibility audit" roadmap item.
      - name: Accessibility (axe)
        run: npm run test:a11y
        continue-on-error: true
