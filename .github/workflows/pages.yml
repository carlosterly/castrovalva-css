name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs, as in GitHub's starter workflow. In one
# job, deploy-pages looked the artifact up moments after uploading it and
# intermittently found none (3 of 4 deploys failed on 24 Nov 2026).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build search index
        run: node scripts/build-search-index.mjs

      # Served as-is, no Jekyll build: deployed from an artifact, so no
      # .nojekyll is needed (upload-pages-artifact v4+ skips dotfiles anyway).
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html favicon.svg favicon-32.png apple-touch-icon.png src docs README.md CLAUDE.md LICENSE _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
