<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #006878; }
    .mark { fill: none; stroke: #ffffff; }
    .dot  { fill: #ffffff; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #5dd4f0; }
      .mark { stroke: #00363f; }
      .dot  { fill: #00363f; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="30" height="30" rx="7" />
  <rect class="mark" x="7.5" y="7.5" width="17" height="17" rx="4" stroke-width="2.4" />
  <rect class="dot" x="13" y="13" width="6" height="6" rx="1.6" />
</svg>
